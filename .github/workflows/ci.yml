name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Start job timer
        run: echo "CONTRACTS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Issue #180: registry and build artifacts cached, keyed on Cargo.lock.
      #
      # This replaces a plain actions/cache over ~/.cargo/registry, ~/.cargo/git
      # and contracts/target with the single key
      # `cargo-${{ hashFiles('contracts/Cargo.lock') }}`. That key only moved when
      # the lockfile moved, so bumping the toolchain restored artifacts built by
      # the *previous* rustc: every crate rebuilt from cold, and because the key
      # still hit, the post-job step never saved a fresh entry. The job stayed
      # wedged on cold builds until someone happened to edit Cargo.lock.
      #
      # Swatinem/rust-cache also keys on the rustc version and workspace metadata,
      # so a toolchain change misses cleanly and re-saves, and it prunes stale
      # fingerprints instead of letting contracts/target — which additionally holds
      # cargo-llvm-cov's target/llvm-cov-target — grow past the repository's 10 GB
      # cache budget, where GitHub starts evicting entries LRU and the cache
      # quietly stops helping.
      - name: Cache cargo registry and build
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace lives in contracts/, so that is what gets keyed
          # and pruned. The registry (~/.cargo/registry, ~/.cargo/git) and build
          # artifacts (contracts/target) are both cached by default.
          workspaces: contracts
          # Keep the lockfile in the key so a dependency change invalidates it.
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          # A missing or unavailable cache backend must never block a PR.
          cache-on-failure: true
      - name: Build contracts
        run: cd contracts && cargo build --target wasm32-unknown-unknown --release
      # Soroban rents on contract bytes, so an unnoticed dependency bump that
      # inflates the wasm artifacts costs real XLM on every deploy. The check
      # records both artifact sizes in the job summary and fails on more than
      # 10% growth over contracts/wasm-size-baseline.txt.
      - name: WASM size check
        run: bash scripts/check-wasm-size.sh
      - name: Upload WASM size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: wasm-size-report.md
          if-no-files-found: ignore
      - name: Clippy
        run: cd contracts && cargo clippy --all-targets --all-features -- -D warnings
      - name: Run contract tests
        run: cd contracts && cargo test
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # Issue #160: measures what the contract test suite actually exercises.
      # 70% is the agreed baseline — comfortably below current coverage so
      # this doesn't block in-flight work, but high enough to catch a
      # whole untested module landing silently. Raise it over time rather
      # than lower it.
      - name: Contract test coverage
        run: |
          cd contracts
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 70
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage-lcov
          path: contracts/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: contracts
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      # Issue #178: fails the build on any RUSTSEC advisory in
      # contracts/Cargo.lock. Accepted exceptions go in contracts/audit.toml
      # (with a rationale comment), not as a CLI flag here, so they're
      # visible in a normal code review instead of buried in workflow YAML.
      - name: cargo audit
        run: cd contracts && cargo audit --config audit.toml
      # Issue #180: makes "measurable reduction in job duration" checkable from the
      # run itself rather than by eyeballing two runs side by side. If the cache
      # ever regresses to a miss, the summary says so on the run that shows it.
      - name: Report cache status and job duration
        if: always()
        run: |
          started=${CONTRACTS_JOB_START:-$(date +%s)}
          duration=$(( $(date +%s) - started ))
          {
            echo "### Contracts job"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| cargo cache hit | \`${{ steps.cargo-cache.outputs.cache-hit }}\` |"
            echo "| contracts/Cargo.lock | \`${{ hashFiles('contracts/Cargo.lock') }}\` |"
            echo "| Job duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/package-lock.json
      # Issue #132: the frontend reads proposals through @quorum/sdk, linked
      # from ../sdk, so the SDK's dist/ must exist before type-check and build.
      - name: Build SDK
        run: cd sdk && npm ci && npm run build
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci
      # Issue #176: lint was declared but never run in CI, so violations
      # reached main freely.
      - name: Lint
        run: cd frontend && npm run lint
      # Issue #177: real test script, no longer --passWithNoTests.
      # Issue #168 / #169: --ci makes Jest refuse to write or accept a
      # snapshot baseline, so a visual or accessibility regression fails the
      # run instead of silently rewriting components/__snapshots__/. Refresh
      # baselines locally with `npm run test:update` and review the diff.
      - name: Test
        run: cd frontend && npm test -- --ci
      - run: cd frontend && npm run build
      # Issue #179: fails on any high/critical advisory and prints the
      # advisory + dependency path (npm audit's default human output).
      - name: npm audit (high + critical)
        run: cd frontend && npm audit --audit-level=high

  sdk:
    name: Build and test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd sdk && npm ci
      # Issue #131: ESLint config now committed; lint was previously a no-op.
      - name: Lint
        run: cd sdk && npm run lint
      - run: cd sdk && npm run build
      # Issue #125: require() and import must both resolve through the
      # exports map, and the Freighter helper must stay out of the root entry.
      - name: Smoke test (ESM + CJS)
        run: cd sdk && npm run test:smoke
      # Issue #129: encoding/decoding tests against a mocked RPC, plus the
      # error-enum drift check against the Rust contracts (#130).
      - name: Test
        run: cd sdk && npm test -- --ci
      # Issue #179: sdk/ currently has two known high-severity advisories
      # with no automated check surfacing them.
      - name: npm audit (high + critical)
        run: cd sdk && npm audit --audit-level=high

  # Issue #332: nothing previously flagged `unsafe` entering the contracts or
  # their dependency tree. `#![no_std]` Soroban code should essentially never
  # need it, so new unsafe is a deliberate, reviewable event rather than
  # something that slips in with an unrelated dependency bump.
  unsafe-audit:
    name: Unsafe Rust Audit (cargo-geiger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          # Distinct key from the contracts job: geiger resolves the same
          # lockfile but writes its own target state.
          key: geiger-${{ hashFiles('contracts/Cargo.lock') }}
          cache-on-failure: true
      # geiger scans the sources of every crate in the dependency tree, so the
      # registry sources have to be on disk first.
      - name: Fetch dependencies
        run: cd contracts && cargo fetch --locked
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      # Reports unsafe usage across the contracts and their dependency tree
      # and records the baseline in the job summary plus an artifact. The
      # scan step itself is informational — the blocking policy is the
      # first-party check below — so a geiger/toolchain breakage warns
      # instead of wedging every PR on a reporting job.
      - name: cargo geiger baseline
        run: |
          cd contracts
          if cargo geiger --format markdown > geiger-report.md 2> geiger-stderr.log; then
            {
              echo "### cargo-geiger baseline"
              echo ""
              echo "Unsafe usage across \`contracts/\` and its dependency tree."
              echo "Policy and triage: \`docs/static-analysis.md\`."
              echo ""
              echo '```text'
              head -n 80 geiger-report.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            {
              echo "### cargo-geiger baseline"
              echo ""
              echo "::warning::cargo-geiger exited with status ${status}; baseline incomplete."
              echo ""
              echo '```text'
              tail -n 40 geiger-stderr.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload geiger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: |
            contracts/geiger-report.md
            contracts/geiger-stderr.log
          if-no-files-found: ignore
      # Issue #332 AC: new `unsafe` in first-party code requires explicit
      # justification in the PR description. This check enforces the default
      # of "none"; landing a justified unsafe block means updating this check
      # in the same PR, which forces the justification into review.
      - name: Forbid unsafe in first-party contract code
        run: |
          if grep -rnE 'unsafe[[:space:]]*(\{|fn\b|impl\b|trait\b|mod\b)|unsafe[[:space:]]+extern|allow\(unsafe_code\)' \
              contracts/governance/src contracts/token/src; then
            echo "::error::unsafe found in first-party contract code. Per docs/static-analysis.md this needs explicit justification in the PR description and a reviewed update to this check."
            exit 1
          fi
          echo "No unsafe in first-party contract code."
