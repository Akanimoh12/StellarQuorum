# cargo-deny configuration for the contracts workspace (issue #336).
#
# Only the `licenses` check runs in CI (`cargo deny check licenses`); advisory
# and ban checks are already covered by `cargo audit` and review. The allowed
# license list below is documented for humans in docs/dependency-licenses.md —
# keep the two in sync when changing either.

[licenses]
# Permissive licenses only. The project is MIT-licensed, so any of these can
# be combined with it without imposing copyleft obligations on integrators.
# Copyleft licenses (GPL, LGPL, AGPL, MPL, EPL, SSPL, BUSL) are deliberately
# absent: introducing one fails CI until it is replaced or explicitly
# reviewed and added here with a rationale.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]

# SPDX expressions like `(MIT OR Apache-2.0)` are resolved against the list
# above; 0.8 is cargo-deny's default confidence for license-file-only crates.
confidence-threshold = 0.8
